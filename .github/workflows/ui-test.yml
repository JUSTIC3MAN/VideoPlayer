# Opens VideoPlayer on a GitHub Mac (Apple Silicon) with a test setlist of four videos split into two parts
# by two loop rows (plus one video with its own loop), presses the show keys, clicks the on-screen buttons,
# and takes a screenshot after each step.
# Screenshots and logs go to the "ui-test" pre-release (not the download people install).
name: UI test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Old setlist formats carry over (their loops become loop rows)
        run: |
          M="$PWD/.github/test-media"
          D="$HOME/Library/Application Support/VideoPlayer"
          mkdir -p "$D"
          check() {  # $1 = what the log should say about the loops, $2 = test name
            build/VideoPlayer.app/Contents/MacOS/VideoPlayer > migrate.log 2>&1 &
            sleep 6; pkill -x VideoPlayer; sleep 1
            grep "Loaded setlist" migrate.log
            if grep -qF "$1" migrate.log; then echo "::notice title=$2::$1"; else echo "::error title=$2 failed::$(grep 'Loaded setlist' migrate.log)"; exit 1; fi
          }
          # Version 1: one loop -> a loop row at the top, so it still plays after every video
          python3 - "$M" "$D/Current Setlist.json" <<'PY'
          import json, sys, uuid
          m, out = sys.argv[1], sys.argv[2]
          cues = [{"id": str(uuid.uuid4()).upper(), "file": {"path": f"{m}/song_red.mp4"}, "duration": 0}]
          json.dump({"version": 1, "cues": cues, "defaultLoop": {"path": f"{m}/loop_bars.mp4"},
                     "crossfade": 0.5, "fillScreen": False, "videoAudio": True}, open(out, "w"))
          PY
          check "1 videos, 1 loops: loop_bars (videos 1-1)" "Version 1 setlist"
          # Version 2: Loops 1-3 -> Loop 1 at the top, Loops 2 and 3 at the end
          python3 - "$M" "$D/Current Setlist.json" <<'PY'
          import json, sys, uuid
          m, out = sys.argv[1], sys.argv[2]
          cues = [{"id": str(uuid.uuid4()).upper(), "file": {"path": f"{m}/{n}.mp4"}, "duration": 0}
                  for n in ("song_red", "song_blue", "song_green", "song_yellow")]
          loops = [{"path": f"{m}/{n}.mp4"} for n in ("loop_bars", "loop_2", "loop_3")]
          json.dump({"version": 2, "cues": cues, "loopSlots": loops,
                     "crossfade": 0.5, "fillScreen": False, "videoAudio": True}, open(out, "w"))
          PY
          check "4 videos, 3 loops: loop_bars (videos 1-4), loop_2 (no videos), loop_3 (no videos)" "Version 2 setlist"

      - name: Prepare a test setlist (two parts, each with its own loop)
        run: |
          M="$PWD/.github/test-media"
          D="$HOME/Library/Application Support/VideoPlayer"
          mkdir -p "$D"
          python3 - "$M" "$D/Current Setlist.json" <<'PY'
          import json, sys, uuid
          m, out = sys.argv[1], sys.argv[2]
          def row(name, loop=False, own=None):
              r = {"id": str(uuid.uuid4()).upper(), "file": {"path": f"{m}/{name}.mp4"}, "duration": 0, "isLoop": loop}
              if own: r["loop"] = {"path": f"{m}/{own}.mp4"}
              return r
          # Part 1: loop_bars after red and blue. Part 2: loop_2 after green; yellow has its own loop (loop_3).
          cues = [row("loop_bars", True), row("song_red"), row("song_blue"),
                  row("loop_2", True), row("song_green"), row("song_yellow", own="loop_3")]
          json.dump({"version": 3, "cues": cues, "crossfade": 0.5, "fillScreen": False, "videoAudio": True},
                    open(out, "w"))
          PY

      - name: Install a mouse-click tool
        run: brew install cliclick

      - name: Run the app, press keys and click buttons
        run: |
          set +e
          mkdir -p shots
          step() { echo "== $1" | tee -a steps.log; }
          shot() { screencapture -x "shots/$1.png"; }
          front() { osascript -e 'tell application "System Events" to tell process "VideoPlayer" to set frontmost to true' >> steps.log 2>&1; }
          key()  { front; osascript -e "tell application \"System Events\" to $1" >> steps.log 2>&1; }
          # Real mouse clicks at the button positions (screen points; the window opens at the same place every run)
          click() { front; sleep 0.3; cliclick "c:$2" >> steps.log 2>&1; step "clicked $1 at $2"; }
          dclick() { front; sleep 0.3; cliclick "dc:$2" >> steps.log 2>&1; step "double-clicked $1 at $2"; }
          rclick() { front; sleep 0.3; cliclick "rc:$2" >> steps.log 2>&1; step "right-clicked $1 at $2"; }
          NEXT=775,450; PREVIOUS=684,507; PAUSE=787,507; LOOP=878,507; BACKONE=680,539; BLACKOUT=793,539; STOP=888,539
          SEEK75=884,391; ADD=230,87; USELOOP=362,87
          # The setlist opens as two columns (the test setlist is split at its loop rows): Part 1 = loop_bars, red, blue;
          # Part 2 = loop_2, green, yellow
          LOOPBARS=180,192; RED=180,251; LOOP2=440,192; GREEN=440,251; YELLOW=440,306
          NAME1=60,138; MENU1=239,138; MENU2=499,138; COL1END=180,440
          drag() { front; sleep 0.3; cliclick "dd:$2" w:300 "dm:$3" w:150 "dm:$4" w:150 "dm:$5" w:300 "du:$5" >> steps.log 2>&1; step "dragged $1 from $2 to $5"; }

          build/VideoPlayer.app/Contents/MacOS/VideoPlayer > app.log 2>&1 &
          sleep 8
          front; sleep 1
          shot 01_opened

          step "KEYS"
          key "key code 49";  sleep 0.7                 # Space: Next
          click "seek bar at 75%" $SEEK75; sleep 0.4; shot 02_space_plays_red_then_seek_75
          sleep 3.5;                                    shot 03_red_ended_loop1_on_screen
          key "key code 124"; sleep 1                   # Right arrow: Next
          key "keystroke \"p\""; sleep 1;               shot 04_blue_paused_with_p
          sleep 2;                                      shot 05_still_paused_2s_later
          key "keystroke \"p\""; sleep 0.5;             shot 06_p_again_resumes
          sleep 3.5;                                    shot 07_blue_ended_loop1_again
          key "key code 49";  sleep 3.8;                shot 08_green_ended_loop2_on_screen

          step "BUTTONS"
          click "Previous" $PREVIOUS;   sleep 1;   shot 09_previous_plays_blue
          click "Pause" $PAUSE;         sleep 1;   shot 10_pause_button_paused
          click "Resume" $PAUSE;        sleep 3.8; shot 11_resume_then_blue_ended_loop1
          click "Stop" $STOP;           sleep 1.5; shot 12_click_stop_black
          click "NEXT" $NEXT;           sleep 1.5; shot 13_click_next_plays_red
          sleep 3.5;                                          shot 14_red_ended_loop1
          click "NEXT" $NEXT;           sleep 0.8
          click "Blackout" $BLACKOUT;   sleep 1;   shot 15_next_blue_then_blackout_on
          sleep 3.5;                                          shot 16_blue_ended_screen_stays_black
          click "Blackout" $BLACKOUT;   sleep 1;   shot 17_blackout_off_shows_loop
          click "Loop" $LOOP;           sleep 1;   shot 18_click_loop
          click "Back One" $BACKONE; sleep 1;   shot 19_back_one_next_moves_up
          dclick "yellow" $YELLOW;            sleep 4.3; shot 20_yellow_ended_its_own_loop3
          dclick "loop_2" $LOOP2;             sleep 1.5; shot 21_doubleclick_loop2_shows_it_now
          key "keystroke \"l\""; sleep 1;            shot 21b_L_back_to_yellows_own_loop3
          click "red" $RED;                   sleep 0.5
          click "Use as Loop" $USELOOP; sleep 1; shot 22_red_turned_into_a_loop
          click "Use as Video" $USELOOP; sleep 1; shot 23_red_back_to_a_video

          step "LOOP BEFORE THE SHOW (L / controller X: the loop of the part NEXT is in)"
          click "Stop" $STOP;           sleep 1.5
          rclick "green" $GREEN;        sleep 1
          key "keystroke \"Set\""; sleep 0.5; key "key code 36"; sleep 1; shot 23b_green_set_as_next
          key "keystroke \"l\""; sleep 1.5;          shot 23c_L_before_show_shows_part2_loop
          dclick "loop_bars" $LOOPBARS;       sleep 1.5; shot 23d_doubleclick_loop_bars
          key "keystroke \"l\""; sleep 1;            shot 23e_L_back_to_part2_loop
          click "Stop" $STOP;           sleep 1.5

          step "COLUMNS"
          dclick "column 1 name" $NAME1;      sleep 1
          key "keystroke \"a\" using {command down}"; key "keystroke \"Kimiko\""; key "key code 36"; sleep 1; shot 23f_column_named_Kimiko
          rclick "yellow" $YELLOW;            sleep 1
          key "keystroke \"Move\""; sleep 0.3; key "key code 124"; sleep 0.5; key "key code 36"; sleep 1; shot 23g_yellow_moved_to_Kimiko
          drag "green to Kimiko" $GREEN 430,262 300,330 $COL1END; sleep 1; shot 23h_green_dragged_to_Kimiko
          click "column 2 menu" $MENU2;       sleep 1
          key "keystroke \"Move Column L\""; sleep 0.3; key "key code 36"; sleep 1; shot 23i_column_2_moved_left
          click "column 1 menu" $MENU1;       sleep 1
          key "keystroke \"Move Column R\""; sleep 0.3; key "key code 36"; sleep 1; shot 23j_and_back_right
          key "keystroke \"n\" using {command down, shift down}"; sleep 1.2
          key "keystroke \"Encore\""; key "key code 36"; sleep 1; shot 23k_added_column_Encore

          step "ADD VIDEOS (file window, pick a video by its path)"
          click "Add Videos" $ADD; sleep 3; shot 24_add_videos_after_3s
          sleep 5;                                            shot 25_add_videos_after_8s
          key "keystroke \"g\" using {command down, shift down}"; sleep 2
          key "keystroke \"$PWD/.github/test-media/song_blue.mp4\""; sleep 1; shot 26_go_to_file
          key "key code 36"; sleep 2;                         shot 27_file_selected
          key "key code 36"; sleep 3;                         shot 28_after_open_setlist_has_5_videos

          key "keystroke \"f\""; sleep 2;                     shot 29_key_f_output_fullscreen
          key "key code 53"; sleep 1;                         shot 30_esc_output_hidden

          pkill -x VideoPlayer
          echo "--- app log" >> steps.log; cat app.log >> steps.log
          cat steps.log

          # The app's log must show every step above, in this order.
          python3 - app.log <<'PY'
          import sys
          log = open(sys.argv[1], errors="replace").read().splitlines()
          want = ['Play #1 "song_red"', "Loop visual: loop_bars",          # Space; part 1's loop
                  'Play #2 "song_blue"', "Paused", "Resumed",              # Right arrow; P; P
                  "Loop visual: loop_bars",
                  'Play #3 "song_green"', "Loop visual: loop_2",           # Space; part 2's loop
                  'Play #2 "song_blue"',                                   # Previous button
                  "Paused", "Resumed", "Loop visual: loop_bars",           # Pause / Resume buttons
                  "Stop", 'Play #1 "song_red"', "Loop visual: loop_bars",  # Stop; NEXT
                  'Play #2 "song_blue"', "Blackout on", "Loop visual: loop_bars", "Blackout off",
                  'Play #4 "song_yellow"', "Loop visual: loop_3",          # double-click; its own loop
                  "Show loop now: loop_2",                                 # double-click a loop row
                  "Loop visual: loop_3",                                   # L: back to yellow's own loop
                  "Now a loop: song_red", "Now a video: song_red",         # Use as Loop / Use as Video
                  "Stop", "Loop visual: loop_2",                           # Set as Next green; L before the show
                  "Show loop now: loop_bars", "Loop visual: loop_2",       # pick one by hand; L goes back
                  "Stop",
                  "Column named Kimiko",                                   # double-click a column name, type, Return
                  "Moved song_yellow to column Kimiko",                    # right-click → Move to Column
                  "Moved song_green to column Kimiko",                     # drag to another column
                  "Moved column Part 2", "Moved column Part 2",            # column menu: left, then right
                  "Added column Part 3", "Column named Encore",            # File → Add Column (⇧⌘N)
                  "Added 1 video(s)"]
          i = 0
          for line in log:
              if i < len(want) and want[i] in line:
                  i += 1
          if i == len(want):
              print(f"::notice title=Show log as expected::all {len(want)} steps happened in order")
          else:
              print(f"::error title=Show log differs::step {i + 1} of {len(want)} never happened: {want[i]}")
              sys.exit(1)
          PY

      - name: Publish screenshots and log to the ui-test pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd shots && zip -q ../ui-test-shots.zip *.png)
          gh release view ui-test >/dev/null 2>&1 || gh release create ui-test --prerelease --title "UI test results (not an install)" --notes "Screenshots from the automated UI test. Install VideoPlayer from the latest release instead."
          gh release upload ui-test ui-test-shots.zip steps.log --clobber
