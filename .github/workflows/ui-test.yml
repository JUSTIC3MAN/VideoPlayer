# Opens VideoPlayer on a GitHub Mac (Apple Silicon) with three test videos and a loop, presses the show
# keys and clicks the on-screen buttons, and takes a screenshot after each step.
# Screenshots and logs go to the "ui-test" pre-release (not the download people install).
name: UI test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Prepare a test setlist (3 videos + a loop)
        run: |
          M="$PWD/.github/test-media"
          D="$HOME/Library/Application Support/VideoPlayer"
          mkdir -p "$D"
          python3 - "$M" "$D/Current Setlist.json" <<'PY'
          import json, sys, uuid
          m, out = sys.argv[1], sys.argv[2]
          cues = [{"id": str(uuid.uuid4()).upper(), "file": {"path": f"{m}/{n}.mp4"}, "duration": 0}
                  for n in ("song_red", "song_blue", "song_green")]
          show = {"version": 1, "cues": cues, "defaultLoop": {"path": f"{m}/loop_bars.mp4"},
                  "crossfade": 0.5, "fillScreen": False, "videoAudio": True}
          json.dump(show, open(out, "w"))
          PY

      - name: Install a mouse-click tool
        run: brew install cliclick

      - name: Run the app, press keys and click buttons
        run: |
          set +e
          mkdir -p shots
          step() { echo "== $1" | tee -a steps.log; }
          shot() { screencapture -x "shots/$1.png"; }
          front() { osascript -e 'tell application "System Events" to tell process "VideoPlayer" to set frontmost to true' >> steps.log 2>&1; }
          key()  { front; osascript -e "tell application \"System Events\" to $1" >> steps.log 2>&1; }
          # Real mouse clicks at the button positions (screen points; the window opens at the same place every run)
          click() { front; sleep 0.3; cliclick "c:$2" >> steps.log 2>&1; step "clicked $1 at $2"; }
          dclick() { front; sleep 0.3; cliclick "dc:$2" >> steps.log 2>&1; step "double-clicked $1 at $2"; }
          NEXT=775,457; BACK=634,513; LOOP=721,513; BLACKOUT=818,513; STOP=916,513; ADD=366,87; ROW3=220,304; SEEK75=884,395

          build/VideoPlayer.app/Contents/MacOS/VideoPlayer > app.log 2>&1 &
          sleep 8
          front; sleep 1
          shot 01_opened

          step "KEYS"
          key "key code 49";  sleep 0.7
          click "seek bar at 75%" $SEEK75; sleep 0.4; shot 02_space_plays_red_then_seek_75
          sleep 3.5;                     shot 03_red_ended_into_loop
          key "key code 124"; sleep 1.5; shot 04_right_arrow_plays_blue
          sleep 3.5

          step "BUTTONS"
          click "Stop" $STOP;           sleep 1.5; shot 05_click_stop_black
          click "NEXT" $NEXT;           sleep 1.5; shot 06_click_next_plays_red
          sleep 3.5;                               shot 07_red_ended_into_loop
          click "NEXT" $NEXT;           sleep 0.8
          click "Blackout" $BLACKOUT;   sleep 1;   shot 08_next_blue_then_blackout_on
          sleep 3.5;                               shot 09_blue_ended_screen_stays_black
          click "Blackout" $BLACKOUT;   sleep 1;   shot 10_blackout_off_shows_loop
          click "Loop" $LOOP;           sleep 1;   shot 11_click_loop
          click "Back" $BACK;           sleep 1;   shot 12_click_back_next_moves_up
          dclick "row 3 (green)" $ROW3; sleep 1.5; shot 13_doubleclick_row3_plays_green

          step "ADD VIDEOS (file window, pick a video by its path)"
          click "Add Videos" $ADD;      sleep 3;   shot 14_add_videos_after_3s
          sleep 5;                                 shot 15_add_videos_after_8s
          key "keystroke \"g\" using {command down, shift down}"; sleep 2
          key "keystroke \"$PWD/.github/test-media/song_blue.mp4\""; sleep 1; shot 16_go_to_file
          key "key code 36"; sleep 2;              shot 17_file_selected
          key "key code 36"; sleep 3;              shot 18_after_open_setlist_has_4

          key "keystroke \"f\""; sleep 2;          shot 19_key_f_output_fullscreen
          key "key code 53"; sleep 1;              shot 20_esc_output_hidden

          pkill -x VideoPlayer
          echo "--- app log" >> steps.log; cat app.log >> steps.log
          cat steps.log

      - name: Publish screenshots and log to the ui-test pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd shots && zip -q ../ui-test-shots.zip *.png)
          gh release view ui-test >/dev/null 2>&1 || gh release create ui-test --prerelease --title "UI test results (not an install)" --notes "Screenshots from the automated UI test. Install VideoPlayer from the latest release instead."
          gh release upload ui-test ui-test-shots.zip steps.log --clobber
