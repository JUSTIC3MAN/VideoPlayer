# Checks the in-app updater: installs an old release, opens it, accepts "Update and Restart",
# and confirms the newer version replaced it and reopened. Results go to the ui-test pre-release.
name: Update test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install an old version (1.0.3) the way the Terminal line does
        run: |
          curl -fL -o old.zip https://github.com/${{ github.repository }}/releases/download/v1.0.3/VideoPlayer.zip
          ditto -x -k old.zip old
          rm -rf /Applications/VideoPlayer.app
          mv old/VideoPlayer.app /Applications/
          defaults read /Applications/VideoPlayer.app/Contents/Info CFBundleShortVersionString

      # The app asks GitHub's API for the latest release without a login, like this. GitHub allows 60 such
      # requests an hour per internet address, and GitHub's test Macs share addresses, so the allowance is
      # sometimes used up by others. Then the test can't run (on a real Mac the app asks once per launch).
      - name: Can this Mac ask GitHub for the latest release (as the app does)?
        run: |
          curl -s -i -H "User-Agent: VideoPlayer-updater" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" -o api.txt || true
          grep -i "^HTTP\|^x-ratelimit-limit\|^x-ratelimit-remaining" api.txt || true
          grep -o '"tag_name": *"[^"]*"' api.txt || grep -o '"message": *"[^"]*"' api.txt || true
          if grep -qi "rate limit exceeded" api.txt; then
            echo "RATE_LIMITED=1" >> "$GITHUB_ENV"
            echo "::warning title=Update test skipped::GitHub's API allowance for this test Mac's internet address is used up (shared with other GitHub test Macs), so the updater can't be tested on it right now."
          fi

      - name: Open it and click "Update and Restart"
        if: env.RATE_LIMITED != '1'
        run: |
          set +e
          log() { echo "$1" | tee -a update.log; }
          log "installed: $(defaults read /Applications/VideoPlayer.app/Contents/Info CFBundleShortVersionString)"
          open /Applications/VideoPlayer.app
          sleep 12
          # If no update window has come up by itself, ask from the menu (a check asked for always answers,
          # so a failure shows its reason on screen).
          WINDOWS="$(osascript -e 'tell application "System Events" to count windows of process "VideoPlayer"' 2>/dev/null || echo 1)"
          log "windows after 12 s: $WINDOWS"
          if [ "${WINDOWS:-1}" -lt 2 ]; then
            osascript -e 'tell application "System Events" to tell process "VideoPlayer" to click menu item "Check for Updates…" of menu "VideoPlayer" of menu bar 1' >> update.log 2>&1
            sleep 8
          fi
          screencapture -x update_1_alert.png
          # The update alert's default button is "Update and Restart": press Return.
          osascript -e 'tell application "System Events" to tell process "VideoPlayer" to set frontmost to true' -e 'tell application "System Events" to key code 36' >> update.log 2>&1
          sleep 20
          screencapture -x update_2_after.png
          NEW="$(defaults read /Applications/VideoPlayer.app/Contents/Info CFBundleShortVersionString)"
          log "after update: $NEW"
          if pgrep -x VideoPlayer >/dev/null; then log "running: yes"; else log "running: no"; fi
          cat update.log
          [ "$NEW" != "1.0.3" ] && pgrep -x VideoPlayer >/dev/null

      - name: Publish results to the ui-test pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ui-test >/dev/null 2>&1 || gh release create ui-test --prerelease --title "UI test results (not an install)" --notes "Screenshots from the automated tests. Install VideoPlayer from the latest release instead."
          gh release upload ui-test update.log update_1_alert.png update_2_after.png --clobber
